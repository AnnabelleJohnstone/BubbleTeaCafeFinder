<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧋 Bubble Tea Finder</title>
  
  <!-- Leaflet CSS (free map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Your styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>🧋 Bubble Tea Finder</h1>
    
    <div class="buttons">
      <button onclick="getLocation()">Find Bubble Tea Near Me</button>
      <button onclick="showSaved()">Show Saved Spots</button>
    </div>
    
    <div class="main-content">
      <div class="cards"></div>
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS (free!) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Hammer.js for swipe gestures -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  
  <!-- Your script -->
  <script src="main.js"></script>
</body>
</html>
